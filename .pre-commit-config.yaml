# Pre-commit hooks for maps-timeline.
# Install: make install-dev  (or pre-commit install && pre-commit install --hook-type pre-push)
#
# On commit: hygiene + auto-format (black, isort, ruff).
# On push:    full quality gate (ruff, flake8, pylint, mypy, pyright, bandit) + pytest.
# Mirrors:    make format (commit) · make quality + make test (pre-push) · CI workflows.

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # make format — black (config: pyproject.toml [tool.black])
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        args: [--config, pyproject.toml]
        files: ^(maps_timeline|tests)/

  # make format — ruff check --fix (config: pyproject.toml [tool.ruff])
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix, --config=pyproject.toml]
        files: ^(maps_timeline|tests)/

  # make format — isort + pre-push gates (via uv / make)
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run isort --settings-path pyproject.toml
        language: system
        types: [python]
        files: ^(maps_timeline|tests)/

      # make quality — lint + type-check + security
      - id: make-quality
        name: make quality
        entry: make quality
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # make test — pytest with 100% coverage on maps_timeline/
      - id: make-test
        name: make test
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
