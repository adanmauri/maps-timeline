---
name: "🐛 Bug Report"
description: Report a bug in a command, the walk on the phone, or the dataset
title: "(short issue description)"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Your Timeline is personal data. Do not paste place names, addresses, coordinates or an
        official export here; describe a dump or screenshot as anonymized before attaching it.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What is the problem, and which command shows it (run, scrape, normalize, import, stats, parse-file, dump)?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: |
        What actually happened? Include the full error and the CLI output: where the walk stopped,
        the failed days, the plan line. Redact paths that contain personal data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: |
        The exact command with its options, and what was on the phone's screen before it started.
        For a parsing problem, an anonymized dump (`maps-timeline dump`, or one from `raw/debug/`)
        that `maps-timeline parse-file` reproduces it with.
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Phone and Google Maps
      description: Needed for a problem on the phone; skip it for one that runs without the phone.
      value: |
        - Device (manufacturer and model):
        - Android version (and API level):
        - OEM UI (One UI, stock Pixel, HyperOS...):
        - Screen size and density (`adb shell wm size`, `adb shell wm density`):
        - Google Maps version (`adb shell dumpsys package com.google.android.apps.maps | grep versionName`):
        - Maps language and region:
        - Driver (`--prefer u2` or `--prefer adb`):
        - Anything else on the phone that changes the screen (font or display size, dark mode, battery saver, wireless adb):
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Possible Solution
      description: Suggest a fix or reason for the bug.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version used
      description: The maps-timeline version (`pyproject.toml`) or commit (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Computer (OS name and version)
    validations:
      required: true
