---
name: Release

# A person starts it from the Actions tab with the version to release. It builds the wheel and the
# sdist from the chosen commit and creates a draft release pinned to that commit; the person
# reviews the notes and publishes the draft from the web (docs/DEVELOPMENT.md, Releasing). A draft
# creates its tag only when published, and immutable releases keep the tag and assets fixed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, matching `version` in pyproject.toml (e.g. v0.1.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check the tag matches the package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(uv version --short)
          echo "Package version: $version, tag: $TAG"
          test "$TAG" = "v$version"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          gh release create "$TAG" dist/* --repo "$REPO" --draft --target "$TARGET" \
            --title "maps-timeline $TAG" --generate-notes
