---
name: Tests & Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Pull requests that change none of the files the tests depend on skip them; main always runs
    # them (docs/adr/0012). The filter lives in a job, not in `paths:`, because `test` is a
    # required check: a job skipped by its condition reports success, while a workflow that never
    # starts leaves the check pending and blocks the merge.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the tests run
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          TESTED_FILES: >-
            ^(maps_timeline/|tests/|pyproject\.toml|uv\.lock|\.python-version|\.github/workflows/tests\.yaml)
        run: |
          run=true
          if [ "$EVENT_NAME" = pull_request ] &&
            ! git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE "$TESTED_FILES"; then
            run=false
          fi
          echo "Run the tests: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  test:
    # The development Python (.python-version), with the 100% coverage gate from pyproject.toml.
    # The README's coverage badge is static: it states this gate, so it changes with it.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Run tests with the coverage gate
        run: uv run --no-sync pytest

  test-compat:
    # Python 3.13, the oldest the tool supports (requires-python), in a throwaway environment.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Run tests on Python 3.13
        run: make test-compat
