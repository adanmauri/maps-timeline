[project]
name = "maps-timeline"
version = "0.1.0"
description = "Exporter for the Google Maps location history (Routes/Timeline)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adán Mauri Ungaro", email = "adan.mauri@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "typer>=0.12",
    "uiautomator2>=3.5.2",
]

[dependency-groups]
test = ["pytest", "pytest-cov"]
lint = [
    "bandit",
    "black",
    "flake8",
    "isort",
    "mypy",
    "pandas-stubs",
    "pylint",
    "pylint-pydantic",
    "pyright",
    "ruff",
    "types-requests",
    "yamllint",
]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[project.urls]
Homepage = "https://github.com/adanmauri/maps-timeline"
Repository = "https://github.com/adanmauri/maps-timeline"
Issues = "https://github.com/adanmauri/maps-timeline/issues"

[project.scripts]
maps-timeline = "maps_timeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maps_timeline"]

[tool.black]
line-length = 100
target-version = ["py313", "py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length is owned by black (see AGENTS.md).
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Third-party libraries without type stubs.
module = ["uiautomator2.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.13"

[tool.pylint.main]
py-version = "3.13"
ignore-paths = ["^\\.venv/.*$"]
load-plugins = ["pylint_pydantic"]

[tool.pylint.format]
max-line-length = 100

[tool.bandit]
exclude_dirs = ["tests", "tooling", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=maps_timeline --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["maps_timeline"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
